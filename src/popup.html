<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Octupus Lead Sync</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>🐙 Octupus Lead Sync</h1>
    <div class="toolbar">
      <span class="badge on">Envío manual</span>
      <button id="options" type="button">Opciones</button>
    </div>
    <div id="session" class="session">Comprobando sesión de odoo.com…</div>

    <div id="manual" class="manual" hidden>
      <button id="sendLead" class="send btn-primary" type="button"></button>
      <button
        id="pushMsgs"
        class="send btn-secondary"
        type="button"
        hidden
        title="Publica en el portal los mensajes nuevos del chatter de este lead"
      >
        ⬆️ Enviar mensajes a odoo.com
      </button>
      <button
        id="pullMsgs"
        class="send btn-secondary"
        type="button"
        hidden
        title="Importa como notas internas los mensajes escritos en el portal"
      >
        ⬇️ Traer mensajes de odoo.com
      </button>
      <div id="manualStatus" class="manual-status" role="status"></div>
    </div>

    <div class="section-head">
      <strong>Leads activos</strong>
      <button id="refreshLeads" class="mini" type="button" title="Recargar la lista">↻</button>
    </div>
    <ul id="leadsList" class="leads"></ul>
    <div id="leadsStatus" class="empty" hidden></div>

    <div class="section-head"><strong>Últimos envíos</strong></div>
    <ul id="log"></ul>
    <div id="empty" class="empty" hidden>Todavía no se ha sincronizado ningún lead.</div>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
