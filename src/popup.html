<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 340px;
      margin: 0;
      padding: .8rem;
      color: #1f2430;
      font-size: .85rem;
    }
    h1 { font-size: 1rem; margin: 0 0 .5rem; }
    .badge {
      display: inline-block;
      padding: .1rem .5rem;
      border-radius: 10px;
      font-size: .75rem;
      font-weight: 600;
    }
    .badge.on { background: #e6f4ea; color: #2e7d32; }
    .badge.off { background: #fdecea; color: #c62828; }
    .badge.warn { background: #fff4e5; color: #b26a00; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: .6rem; }
    button {
      padding: .3rem .7rem;
      border: 1px solid #c4c9d4;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: .8rem;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: .7rem;
    }
    button.mini {
      padding: .1rem .5rem;
      border: 1px solid #c4c9d4;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: .8rem;
    }
    ul.leads { max-height: 190px; }
    ul.leads li { cursor: pointer; display: flex; align-items: center; gap: .5rem; }
    ul.leads li:hover { background: #f4f5f8; }
    ul.leads .lead-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    ul.leads .tag {
      flex-shrink: 0;
      font-size: .68rem;
      padding: .05rem .4rem;
      border-radius: 8px;
      background: #eef0f4;
      color: #6b7280;
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    ul.leads .tag.sync { background: #e6f4ea; color: #2e7d32; }
    ul { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
    li {
      padding: .45rem .3rem;
      border-bottom: 1px solid #eef0f4;
      line-height: 1.35;
    }
    li .name { font-weight: 600; }
    li .meta { color: #6b7280; font-size: .75rem; }
    li.ok .status { color: #2e7d32; }
    li.error .status { color: #c62828; }
    .empty { color: #6b7280; padding: .6rem 0; }
    .check { display: flex; align-items: center; gap: .4rem; }
    .session { margin-bottom: .6rem; font-size: .78rem; color: #6b7280; }
    .session.ok { color: #2e7d32; }
    .session.error { color: #c62828; }
    .manual { margin-bottom: .7rem; }
    button.send {
      width: 100%;
      padding: .5rem;
      border: none;
      border-radius: 6px;
      background: #714b67;
      color: #fff;
      font-size: .85rem;
      font-weight: 600;
    }
    button.send:disabled { opacity: .6; cursor: default; }
    button.send.secondary {
      background: #e8eaf0;
      color: #1f2430;
      font-weight: 500;
      margin-top: .4rem;
    }
    .manual-status { margin-top: .35rem; font-size: .78rem; min-height: 1em; }
    .manual-status.ok { color: #2e7d32; }
    .manual-status.error { color: #c62828; }
  </style>
</head>
<body>
  <h1>🐙 Octupus Lead Sync</h1>
  <div class="toolbar">
    <span class="badge on">Envío manual</span>
    <button id="options">Opciones</button>
  </div>
  <div id="session" class="session">Comprobando sesión de odoo.com…</div>
  <div id="manual" class="manual" hidden>
    <button id="sendLead" class="send"></button>
    <button id="pushMsgs" class="send secondary" hidden
      title="Publica en el portal los mensajes nuevos del chatter de este lead">
      ⬆️ Enviar mensajes a odoo.com
    </button>
    <button id="pullMsgs" class="send secondary" hidden
      title="Importa como notas internas los mensajes escritos en el portal">
      ⬇️ Traer mensajes de odoo.com
    </button>
    <div id="manualStatus" class="manual-status"></div>
  </div>
  <div class="section-head">
    <strong>Leads activos</strong>
    <button id="refreshLeads" class="mini" title="Recargar la lista">↻</button>
  </div>
  <ul id="leadsList" class="leads"></ul>
  <div id="leadsStatus" class="empty" hidden></div>

  <div class="section-head"><strong>Últimos envíos</strong></div>
  <ul id="log"></ul>
  <div id="empty" class="empty" hidden>Todavía no se ha sincronizado ningún lead.</div>
  <script src="popup.js"></script>
</body>
</html>
